defaults:
  - model: transformer
  - writer: wandb
  - metrics: code_generation
  - datasets: tinysms_train
  - dataloader: tinysms
  - transforms: none
  - optimizer: adamw
  - lr_scheduler: cosine
  - data_preparation: tinysms
  - loss_function: code_generation
  - _self_

writer:
  project_name: hw2_code_generation
  run_name: rope_preln

trainer:
  log_step: 50
  n_epochs: 100
  epoch_len: 500
  device_tensors:
    - encoder_input_ids
    - encoder_attention_mask
    - decoder_input_ids
    - decoder_attention_mask
    - labels
  monitor: max val_pass_at_1
  max_grad_norm: 1.0
  resume_from: null
  finetune_from: null # full checkpoint; starts a new stage with a fresh scheduler
  restore_optimizer: true # preserve optimizer moments, apply the new configured LR
  validate_before_training: false
  validation_every_n_epochs: 1
  max_train_seconds: null # includes validation and compilation; final evaluation follows
  device: auto
  override: false
  save_period: 5
  early_stop: ${trainer.n_epochs}
  save_dir: saved
  seed: 1

batching:
  enabled: false
  pool_batches: 64

compile:
  enabled: false
  backend: inductor
  mode: default
  dynamic: null # automatic dynamic shapes
  fallback_to_eager: true # log compiler failures; ordinary model/OOM errors still raise

generation_validation:
  enabled: true
  every_n_epochs: 5
  max_examples: 512
  seed: 42 # fixed random subset, independent of model RNG
  max_new_tokens: 256
  num_beams: [1] # exp07 compares [1, 3] on exactly the same validation questions
  length_penalty: 1.0 # beam score: sum(log probabilities) / generated_length**penalty
  batch_size: null # null: use dataloader.batch_size; independent of training batch
