enabled: true
reuse_from: null # prepared directory: reuse its tokenizer and exact validation split
dataset:
  path: SlavaYus/tinysms_qa_12m
  revision: b2724689ff079e9c22efd548fe134bfb29036dbb
  data_files:
    train: data/train/*.parquet
    test: data/test/test.parquet
  cache_dir: ${oc.env:HF_DATASETS_CACHE,data/hf_cache}
sampling:
  max_rows: 1200000 # before filtering and train/validation splitting; null: full data
  seed: 42
  batch_size: 4096 # source rows read per batch, independent of model batch size
split:
  validation_fraction: 0.02
  seed: 42
  num_proc: null
tokenizer:
  vocab_size: 8192
  min_frequency: 2
  batch_size: 1000
  show_progress: true
tokenizer_train_rows: 50000
tokenize:
  batch_size: 1000
  num_proc: ${data_preparation.split.num_proc}
output_dir: ${oc.env:TINYSMS_DATA_DIR,data/processed/tinysms}
