train:
  - _target_: src.metrics.Perplexity
    name: perplexity
    ignore_index: ${loss_function.ignore_index}
  - _target_: src.metrics.TokenAccuracy
    name: token_accuracy
    ignore_index: ${loss_function.ignore_index}
inference:
  - _target_: src.metrics.Perplexity
    name: perplexity
    ignore_index: ${loss_function.ignore_index}
  - _target_: src.metrics.TokenAccuracy
    name: token_accuracy
    ignore_index: ${loss_function.ignore_index}
generation:
  - _target_: src.metrics.SyntaxValidity
    name: syntax_validity
  - _target_: src.metrics.PassAt1
    name: pass_at_1
    rtol: 1.0e-6
    atol: 1.0e-6
    timeout_seconds: 1.0
    memory_mb: 128
    workers: 2
